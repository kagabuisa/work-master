name: Release checks

on:
  # Only test code that can actually land: main itself and pull requests.
  # Long-lived fix/live branches are deployment snapshots, not forks of main;
  # testing every push to them produced duplicate and stale-base failures.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: work_master_hr_test
          POSTGRES_USER: work_master_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U work_master_test -d work_master_hr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Keep any local-time formatting deterministic regardless of runner region.
      TZ: Africa/Kampala
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: work_master_hr_test
      POSTGRES_USER: work_master_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_URL: postgresql://work_master_test:test_password@127.0.0.1:5432/work_master_hr_test
    steps:
      - uses: actions/checkout@v5
      - name: Build release-check image
        run: docker build --tag work-master-ci .
      - name: Run release checks in the Node 22 / PostgreSQL 16 image
        run: |
          docker run --rm --network host \
            --entrypoint sh \
            -v "$PWD:/workspace:ro" \
            --tmpfs /workspace/data:mode=1777 \
            -w /workspace \
            -e NODE_PATH=/app/node_modules \
            -e TZ=Africa/Kampala \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=work_master_hr_test \
            -e POSTGRES_USER=work_master_test \
            -e POSTGRES_PASSWORD=test_password \
            -e POSTGRES_URL=postgresql://work_master_test:test_password@127.0.0.1:5432/work_master_hr_test \
            work-master-ci \
            -c 'npm run release:check'
